<!doctype html>
<!-- Imagem que aparece ao compartilhar o link (WhatsApp, Instagram, Facebook...).

<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(900px 500px at 85% 20%, #12322F 0%, transparent 60%), #0B1217;color:#C5D0D8;font-family:Inter,system-ui,sans-serif;display:grid;grid-template-columns:600px 1fr;align-items:center;gap:40px;padding:0 64px;box-sizing:border-box}
  .marca{display:flex;align-items:center;gap:16px;margin-bottom:44px}
  .marca svg{width:64px;height:64px}
  .nome{font:800 38px/1 Manrope,sans-serif;letter-spacing:-.035em;color:#F2F6F8}
  .nome em{font-style:normal;font-weight:600;color:#4FD3C6}
  h1{margin:0;font:800 54px/1.06 Manrope,sans-serif;letter-spacing:-.03em;color:#F4F8FA}
  h1 span{color:#4FD3C6}
  p{margin:24px 0 0;font-size:24px;line-height:1.45;color:#AEBBC5;max-width:30ch}
  .url{margin-top:40px;display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:#0D7A72;color:#fff;font:700 22px Manrope,sans-serif}
  .grafico{padding:22px;border:1px solid #1E2A33;border-radius:22px;background:#0A1116;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .topo{display:flex;justify-content:space-between;align-items:center;font-size:17px;color:#7D8B96;margin-bottom:14px}
  .topo b{color:#3CCB7F;font:700 24px "JetBrains Mono",monospace}
  .grafico svg{display:block;width:100%;height:auto}
</style></head><body>
